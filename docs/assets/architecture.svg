<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="70" width="220" height="150" rx="14" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
    <text x="130" y="110" font-size="20" font-weight="bold" fill="#1f2328">Gladys Assistant</text>
    <text x="130" y="140" font-size="14" fill="#57606a">devices, scenes,</text>
    <text x="130" y="160" font-size="14" fill="#57606a">dashboard widget</text>
    <rect x="340" y="70" width="220" height="150" rx="14" fill="#eef8f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="450" y="105" font-size="15" font-weight="bold" fill="#1f2328">gladys-ovhcloud-dynhost</text>
    <text x="450" y="135" font-size="14" fill="#57606a">Docker container</text>
    <text x="450" y="155" font-size="14" fill="#57606a">check every 1 to 30 min</text>
    <text x="450" y="175" font-size="14" fill="#57606a">/data: confirmed records</text>
    <rect x="660" y="30" width="220" height="110" rx="14" fill="#e6f6fc" stroke="#0086b8" stroke-width="2"/>
    <text x="770" y="65" font-size="18" font-weight="bold" fill="#1f2328">OVHcloud DynHost</text>
    <text x="770" y="92" font-size="13" fill="#57606a">dns.eu.ovhapis.com/nic/update</text>
    <text x="770" y="112" font-size="13" fill="#57606a">only when a record must change</text>
    <rect x="660" y="160" width="220" height="110" rx="14" fill="#fff8e6" stroke="#bf8700" stroke-width="2"/>
    <text x="770" y="195" font-size="18" font-weight="bold" fill="#1f2328">Echo services</text>
    <text x="770" y="222" font-size="13" fill="#57606a">ipify, icanhazip, ident.me</text>
    <text x="770" y="242" font-size="13" fill="#57606a">public IPv4 / IPv6 address</text>
    <path d="M245 145 H335" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="290" y="125" font-size="12" fill="#57606a">REST</text>
    <text x="290" y="170" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="290" y="245" font-size="12" fill="#57606a">/api/integration/v1/*</text>
    <path d="M565 120 L655 90" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="600" y="85" font-size="12" fill="#57606a">HTTPS, DynHost</text>
    <text x="600" y="100" font-size="12" fill="#57606a">identifier</text>
    <path d="M565 170 L655 205" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="605" y="215" font-size="12" fill="#57606a">HTTPS</text>
    <text x="450" y="315" font-size="13" fill="#57606a">Cloud transport: the public address is read on echo services, and the records are</text>
    <text x="450" y="335" font-size="13" fill="#57606a">sent to OVHcloud with your DynHost identifier. Illustration.</text>
  </g>
</svg>
