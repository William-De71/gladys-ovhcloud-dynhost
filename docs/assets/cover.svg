<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the OVHcloud DynHost integration for Gladys Assistant
       (illustration, not the logo of OVHcloud). A house with its router, an
       arrow of its public address up to a DNS card where a name points at
       that address, and the globe of the internet. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#1c3f8f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="50" r="1.6"/><circle cx="180" cy="110" r="1.2"/><circle cx="320" cy="40" r="1.4"/>
    <circle cx="470" cy="90" r="1.1"/><circle cx="740" cy="60" r="1.5"/><circle cx="620" cy="30" r="1.2"/>
  </g>

  <!-- the ground -->
  <rect x="0" y="440" width="800" height="94" fill="#0a1736"/>

  <!-- the house -->
  <g transform="translate(70 230)">
    <path d="M0 110 L120 10 L240 110 Z" fill="#e76f51"/>
    <rect x="25" y="105" width="190" height="105" fill="#f4efe6"/>
    <rect x="50" y="130" width="50" height="45" fill="#ffd166"/>
    <path d="M75 130 V175 M50 152 H100" stroke="#f4efe6" stroke-width="4"/>
    <rect x="135" y="140" width="45" height="70" fill="#8d5524"/>
    <!-- the router at the window -->
    <rect x="58" y="185" width="70" height="18" rx="4" fill="#264653"/>
    <circle cx="70" cy="194" r="3" fill="#2ecc71"/><circle cx="82" cy="194" r="3" fill="#2ecc71"/><circle cx="94" cy="194" r="3" fill="#ffd166"/>
    <path d="M70 185 L64 165 M116 185 L122 165" stroke="#264653" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- the public address going up -->
  <path d="M230 270 C 300 170, 360 150, 430 150" fill="none" stroke="#7bdff2" stroke-width="5" stroke-dasharray="14 10"/>
  <path d="M428 136 L452 150 L428 164 Z" fill="#7bdff2"/>
  <rect x="220" y="196" width="150" height="34" rx="17" fill="#7bdff2"/>
  <text x="295" y="219" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="bold" fill="#0b1f4d" text-anchor="middle">203.0.113.7</text>

  <!-- the DNS card -->
  <g transform="translate(465 92)">
    <rect width="290" height="150" rx="16" fill="url(#card)"/>
    <text x="22" y="40" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b1f4d">DynHost</text>
    <rect x="22" y="58" width="246" height="32" rx="6" fill="#dbe6fb"/>
    <text x="34" y="80" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#0b1f4d">home.example.com</text>
    <text x="34" y="122" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#3a4a6b">A → 203.0.113.7</text>
    <circle cx="256" cy="116" r="10" fill="#2ecc71"/>
    <path d="M251 116 L255 120 L262 111" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the globe -->
  <g transform="translate(610 360)" fill="none" stroke="#7bdff2" stroke-width="3">
    <circle r="62"/>
    <ellipse rx="26" ry="62"/>
    <path d="M-62 0 H62 M-54 -30 H54 M-54 30 H54"/>
  </g>
  <path d="M610 245 V292" stroke="#7bdff2" stroke-width="4" stroke-dasharray="8 8"/>

  <text x="400" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">OVHcloud DynHost × Gladys</text>
</svg>
